name: Pages

# 只在落地页真的变了时发布。整个 site/ 是纯静态的，没有构建步骤——
# 直接把目录当 artifact 传上去。
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署；新的推上来时取消正在排队的那个，但不打断正在发布的。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` 让这一步在 Pages 还没启用时自己把它打开（用 Actions 作为源）。
      # 不开的话会直接报 `Get Pages site failed ... Not Found`——第一次部署必然踩到。
      # 想手动控制时，去 Settings → Pages 选 "GitHub Actions"，然后把这一行删掉。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
